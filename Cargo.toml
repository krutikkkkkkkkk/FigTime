[package]
name = "figtime"
version = "2.0.0"
edition = "2024"
description = "Discord Rich Presence for Figma"
authors = ["Krutik Raut"]
license = "MIT"
repository = "https://github.com/krutikkkkkkkkk/FigTime"

[dependencies]
tao = "0.37.2"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }

[build-dependencies]
png = "0.18.1"
winresource = "0.1.34"

# Optimised for size: this is a tiny background app
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
